<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Logistix Group – Site en construction</title>
  <meta name="description" content="Le site d'Alpha Logistix Group est en construction. Contactez-nous : commercial@alphalogistixgroup.com">
  <style>
    :root { --orange: #ff6622; --noir: #111; --gris: #555; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #fff;
      color: var(--noir);
      text-align: center;
      padding: 16px;
    }
    main { max-width: 560px; width: 100%; }
    .logo { width: min(280px, 70vw); height: auto; }
    .badge {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .8rem;
      padding: 6px 16px;
      border-radius: 999px;
      margin-top: 8px;
    }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin: 20px 0 12px; }
    p { color: var(--gris); line-height: 1.6; }
    .bar {
      height: 8px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
      margin: 28px auto 0;
      max-width: 360px;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 65%;
      background: var(--orange);
      border-radius: 999px;
      animation: grow 2.5s ease-out;
    }
    .contacts {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .contacts a {
      color: var(--noir);
      text-decoration: none;
      font-weight: 600;
      border: 2px solid var(--orange);
      border-radius: 12px;
      padding: 12px 20px;
      transition: background .2s, color .2s;
    }
    .contacts a:hover { background: var(--orange); color: #fff; }
    footer { margin-top: 32px; font-size: .8rem; color: #999; }
    @keyframes grow { from { width: 0; } }
  </style>
</head>
